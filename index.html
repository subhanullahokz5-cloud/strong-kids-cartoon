
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strong Kids Cartoon</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f1f6ff;
 color:#172554;
}
header{
 background:linear-gradient(120deg,#633bdb,#1689dc);
 color:white;
 padding:25px 15px;
 text-align:center;
 border-radius:0 0 25px 25px;
}
header h1{margin:5px;font-size:27px}
header p{margin:8px}
.search{
 width:90%;padding:13px;margin:18px 5%;
 border:0;border-radius:12px;font-size:16px;
}
h2{margin:18px 15px}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;padding:12px;
}
.item{
 background:white;padding:20px 8px;
 text-align:center;border-radius:16px;
 box-shadow:0 3px 10px #0001;
 font-size:17px;font-weight:bold;
 cursor:pointer;
}
.emoji{font-size:38px;display:block;margin-bottom:8px}
button{
 border:0;border-radius:12px;
 background:#653bdb;color:white;
 padding:12px 20px;font-size:16px;
}
#content{
 margin:15px;padding:20px;
 background:white;border-radius:16px;
 min-height:100px;text-align:center;
}
footer{text-align:center;padding:20px;color:#555}
</style>
</head>
<body>

<header>
<h1>🌟 Strong Kids Cartoon</h1>
<p>بچوں کی تعلیم اور تفریح کی دنیا</p>
</header>

<input class="search" id="search"
placeholder="🔍 اپنی پسند کی کہانی تلاش کریں">

<h2>📚 ہماری کیٹیگریز</h2>

<div class="grid" id="categories">
<div class="item" onclick="show('cartoon')">
<span class="emoji">🎬</span>بچوں کے کارٹون
</div>
<div class="item" onclick="show('islamic')">
<span class="emoji">🕌</span>اسلامی کہانیاں
</div>
<div class="item" onclick="show('abc')">
<span class="emoji">🔤</span>ABC سیکھیں
</div>
<div class="item" onclick="show('stories')">
<span class="emoji">📖</span>مزے دار کہانیاں
</div>
<div class="item" onclick="show('nasheed')">
<span class="emoji">🎵</span>بچوں کے نعت و نظم
</div>
<div class="item" onclick="show('learning')">
<span class="emoji">🧠</span>تعلیمی سرگرمیاں
</div>
</div>

<div id="content">
<h2>خوش آمدید! ❤️</h2>
<p>اپنی پسند کی کیٹیگری منتخب کریں۔</p>
</div>

<footer>
🌟 Strong Kids Cartoon 🌟
<p>بچوں کا روشن مستقبل ہمارا مقصد</p>
</footer>

<script>
function show(type){
 const data={
 cartoon:["🎬 بچوں کے کارٹون","جلد ہی یہاں کارٹون ویڈیوز شامل ہوں گی۔"],
 islamic:["🕌 اسلامی کہانیاں","جلد ہی یہاں پیاری اسلامی کہانیاں شامل ہوں گی۔"],
 abc:["🔤 ABC سیکھیں","A for Apple 🍎<br>B for Ball ⚽<br>C for Cat 🐱"],
 stories:["📖 مزے دار کہانیاں","جلد ہی یہاں بچوں کی دلچسپ کہانیاں شامل ہوں گی۔"],
 nasheed:["🎵 بچوں کے نعت و نظم","جلد ہی یہاں بچوں کی نظمیں شامل ہوں گی۔"],
 learning:["🧠 تعلیمی سرگرمیاں","آئیے کھیل کھیل میں نئی چیزیں سیکھیں۔"]
 };
 document.getElementById("content").innerHTML=
 "<h2>"+data[type][0]+"</h2><p>"+data[type][1]+"</p>";
}
document.getElementById("search").addEventListener("input",function(){
 let q=this.value.toLowerCase();
 document.querySelectorAll(".item").forEach(item=>{
 item.style.display=item.innerText.toLowerCase().includes(q)?"block":"none";
 });
});
</script>
</body>
</html>
